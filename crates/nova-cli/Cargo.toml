[package]
name = "nova-cli"
description = "NovaReport headless CLI: validate and render .nrep reports (PDF, XLSX, CSV, Typst)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "nova-report"
path = "src/main.rs"

[dependencies]
nova-domain.workspace = true
nova-engine.workspace = true
nova-application.workspace = true
nova-connectors = { workspace = true, features = ["os-keyring"] }
dirs = "6"
serde_json.workspace = true
tokio.workspace = true
