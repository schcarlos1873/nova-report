[package]
name = "nova-engine"
description = "NovaReport engine: DataContext (Polars), formulas (Rhai), band processing and Typst rendering"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
nova-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
chrono.workspace = true
async-trait.workspace = true
futures.workspace = true
base64.workspace = true
tracing.workspace = true
polars.workspace = true
rhai.workspace = true
typst = "0.15"
typst-pdf = "0.15"
typst-svg = "0.15"
typst-layout = "0.15"
typst-assets = { version = "0.15", features = ["fonts"] }
typst-kit = { version = "0.15", default-features = false, features = ["scan-fonts", "embedded-fonts"] }
comemo = "0.5"
rust_xlsxwriter = "0.103"

[dev-dependencies]
tokio.workspace = true
