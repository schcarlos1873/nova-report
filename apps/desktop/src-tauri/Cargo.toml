[package]
name = "nova-report-desktop"
description = "NovaReport Builder — designer de relatórios desktop (Tauri 2)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "nova_report_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nova-domain.workspace = true
nova-engine.workspace = true
nova-application.workspace = true
nova-connectors = { workspace = true, features = ["os-keyring"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri = { version = "~2.11", features = [] }
tauri-plugin-dialog = "~2.7"
