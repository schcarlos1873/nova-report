[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["NovaReport Team"]

[workspace.dependencies]
nova-domain = { path = "crates/nova-domain" }
nova-engine = { path = "crates/nova-engine" }
nova-connectors = { path = "crates/nova-connectors" }
nova-application = { path = "crates/nova-application" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
tracing = "0.1"
base64 = "0.22"
polars = { version = "0.53", default-features = false, features = ["lazy", "csv", "json", "dtype-date", "dtype-datetime", "fmt", "temporal"] }
rhai = "1.27"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
